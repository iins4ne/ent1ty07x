<!DOCTYPE html>
<html lang="en">
    <head>
        <title>ent1ty's site</title>
        <link rel="icon" type="image/png" href="/1.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 24px;
                display: grid;
                place-items: center;
                background: #000;
                color: #f5f5f5;
                font-family: "Segoe UI", Arial, sans-serif;
            }

            main {
                width: min(100%, 620px);
                padding: 48px 32px;
                text-align: center;
                border: 1px solid #262626;
                border-radius: 20px;
                background: #0b0b0b;
                box-shadow: 0 20px 70px #000;
            }

            h1 {
                margin: 0 0 12px;
                font-size: clamp(2.5rem, 8vw, 4rem);
                letter-spacing: -0.06em;
            }

            h2 {
                margin: 0;
                color: #aaa;
                font-size: 1rem;
                font-weight: 400;
            }

            p {
                margin: 28px 0 18px;
                color: #ccc;
            }

            .social-links {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 12px;
            }

            a {
                padding: 11px 18px;
                border: 1px solid #333;
                border-radius: 10px;
                color: #fff;
                background: #151515;
                text-decoration: none;
                transition: border-color 160ms ease, background 160ms ease,
                    transform 160ms ease;
            }

            a:hover {
                transform: translateY(-2px);
                border-color: #8b5cf6;
                background: #1c1528;
            }

            a:focus-visible {
                outline: 2px solid #a78bfa;
                outline-offset: 3px;
            }

            @media (max-width: 480px) {
                main {
                    padding: 40px 22px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>welcome to my site.</h1>
            <h2>this is a work in progress, so please be patient.</h2>
            <p>feel free to join the discord down below</p>
            <div class="social-links">
                <a href="https://www.youtube.com/@ent1ty07x">YouTube</a>
                <a href="https://discord.gg/GTe4sQSFkJ">Discord server</a>
            </div>
        </main>
    </body>
</html>
